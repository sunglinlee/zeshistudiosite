<!doctype html>

<head>

<title>澤拾 Ze Shi Studio｜Links</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
  :root{
    --bg:#F2EFE8;
    --card:#FFFFFF;
    --ink:#2E3D4E;
    --ink-2:#44586A;
    --line:rgba(46,61,78,0.16);
    --muted:#6E6A5E;
    --accent:#B48B52;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1B2027;
      --card:#242B34;
      --ink:#EDE9DF;
      --ink-2:#C9D2D8;
      --line:rgba(237,233,223,0.14);
      --muted:#9AA3AA;
      --accent:#D4AE78;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1B2027;
    --card:#242B34;
    --ink:#EDE9DF;
    --ink-2:#C9D2D8;
    --line:rgba(237,233,223,0.14);
    --muted:#9AA3AA;
    --accent:#D4AE78;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Noto Serif TC",serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:56px 20px 40px;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}
  .en{font-family:"Cormorant Garamond",serif;}
  .wrap{width:100%;max-width:380px;text-align:center;}
  .logo{width:96px;height:auto;margin:0 auto 18px;display:block;}
  h1{margin:0;font-size:34px;font-weight:600;letter-spacing:0.06em;}
  .tracked{margin-top:8px;font-size:13px;letter-spacing:0.32em;color:var(--ink-2);}
  .tagline{margin-top:16px;font-size:14px;letter-spacing:0.1em;color:var(--muted);}
  .links{margin-top:40px;display:flex;flex-direction:column;gap:14px;}
  .link{
    display:flex;align-items:center;gap:14px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:2px;
    padding:16px 20px;
    font-size:16px;
    letter-spacing:0.04em;
    transition:border-color .15s ease, transform .15s ease;
  }
  .link:hover{border-color:var(--accent);transform:translateY(-1px);}
  .link svg{flex:none;color:var(--ink-2);}
  .link .sub{margin-left:auto;font-size:12px;color:var(--muted);letter-spacing:0.08em;}
  .link.disabled{opacity:0.5;pointer-events:none;}
  footer{margin-top:48px;font-size:12px;letter-spacing:0.1em;color:var(--muted);}
</style>


</head>

      LINE 官方帳號
