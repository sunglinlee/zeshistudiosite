<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>極簡現代｜NFC 連結頁範例</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
  :root{--bg:#FAFAF8;--ink:#111;--soft:#77777a;--line:#e4e4e0;}
  @media (prefers-color-scheme:dark){:root{--bg:#0f0f10;--ink:#f3f3f1;--soft:#8d8d92;--line:#26262a;}}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:Manrope,"Noto Sans TC",sans-serif;display:flex;justify-content:center;-webkit-font-smoothing:antialiased;}
  .wrap{width:100%;max-width:400px;padding:88px 28px 48px;display:flex;flex-direction:column;min-height:100vh;}
  .mark{width:14px;height:14px;background:var(--ink);border-radius:50%;}
  h1{margin:28px 0 0;font-weight:800;font-size:44px;line-height:1.05;letter-spacing:-.02em;}
  .tag{margin-top:14px;color:var(--soft);font-size:15px;line-height:1.7;}
  .links{margin-top:56px;border-top:1px solid var(--line);}
  .link{display:flex;align-items:center;justify-content:space-between;padding:22px 0;border-bottom:1px solid var(--line);color:inherit;text-decoration:none;font-weight:600;font-size:18px;transition:padding .2s;}
  .link small{color:var(--soft);font-weight:400;font-size:13px;margin-left:auto;margin-right:14px;}
  .link svg{flex:none;transition:transform .2s;}
  .link:hover,.link:focus-visible{padding-left:8px;}
  .link:hover svg{transform:translateX(4px);}
  .demo{margin-top:auto;padding-top:56px;font-size:11px;letter-spacing:.14em;color:var(--soft);text-transform:uppercase;}
  .demo a{color:inherit;}
  @media (prefers-reduced-motion:reduce){.link,.link svg{transition:none;}}
</style>
</head>
<body>
<main class="wrap">
  <div class="mark" aria-hidden="true"></div>
  <h1>Sample<br>Brand.</h1>
  <p class="tag">範例品牌。一頁整理所有連結，簡單、清楚、好看。</p>
  <nav class="links" aria-label="連結">
    <a class="link" href="#">LINE<small>@sample</small><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
    <a class="link" href="#">Instagram<small>@sample</small><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
    <a class="link" href="#">Website<small>sample.com</small><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
    <a class="link" href="#">Email<small>hello@sample.com</small><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
  </nav>
  <div class="demo">Demo · 澤拾 Ze Shi Studio　<a href="../">More styles</a></div>
</main>
</body>
</html>
