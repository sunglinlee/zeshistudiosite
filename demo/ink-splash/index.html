<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>潑墨｜NFC 連結頁範例</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;900&display=swap">
<style>
  :root{--paper:#F4F0E6;--ink:#15130F;--ink-soft:#5a554b;--seal:#B3261E;}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:"Noto Serif TC",serif;display:flex;justify-content:center;overflow-x:hidden;position:relative;-webkit-font-smoothing:antialiased;}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;background-image:radial-gradient(rgba(21,19,15,.05) 1px,transparent 1px);background-size:5px 5px;}
  .splash{position:absolute;top:-190px;right:-300px;width:520px;height:520px;z-index:0;pointer-events:none;}
  .splash2{position:absolute;bottom:-190px;left:-210px;width:460px;height:460px;z-index:0;pointer-events:none;opacity:.9;}
  .wrap{position:relative;z-index:1;width:100%;max-width:400px;padding:72px 28px 48px;}
  .head{display:flex;gap:22px;align-items:flex-start;}
  .vtitle{writing-mode:vertical-rl;font-weight:900;font-size:64px;line-height:1.05;letter-spacing:.08em;filter:url(#rough);}
  .meta{padding-top:8px;}
  .seal{display:inline-flex;width:46px;height:46px;background:var(--seal);color:#f6ece0;align-items:center;justify-content:center;font-weight:900;font-size:22px;transform:rotate(-4deg);filter:url(#rough);}
  .tag{margin-top:16px;font-size:14px;letter-spacing:.2em;color:var(--ink-soft);line-height:1.9;}
  .links{margin-top:56px;display:flex;flex-direction:column;gap:6px;}
  .link{position:relative;display:flex;align-items:baseline;justify-content:space-between;padding:18px 4px 14px;color:inherit;text-decoration:none;font-size:20px;font-weight:500;letter-spacing:.14em;}
  .link::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--ink);border-radius:2px 60% 3px 40%/3px 5px 2px 4px;transform-origin:left;transform:scaleX(.22);transition:transform .35s cubic-bezier(.2,.8,.2,1);filter:url(#rough);}
  .link:hover::after,.link:focus-visible::after{transform:scaleX(1);}
  .link small{font-size:12px;color:var(--ink-soft);letter-spacing:.1em;font-weight:500;}
  .demo{margin-top:56px;font-size:11px;letter-spacing:.2em;color:var(--ink-soft);}
  .demo a{color:inherit;}
  @media (prefers-reduced-motion:reduce){.link::after{transition:none;}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="4" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="3.5"/>
  </filter>
  <filter id="splat" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="4" seed="9" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="55"/>
  </filter>
</svg>
<svg class="splash" viewBox="0 0 500 500" aria-hidden="true"><g filter="url(#splat)" fill="#15130F">
  <circle cx="300" cy="200" r="120"/><ellipse cx="380" cy="120" rx="70" ry="40"/><circle cx="210" cy="300" r="40"/></g>
  <g fill="#15130F"><circle cx="130" cy="150" r="9"/><circle cx="95" cy="205" r="5"/><circle cx="440" cy="330" r="12"/><circle cx="470" cy="390" r="6"/><circle cx="160" cy="95" r="4"/><circle cx="330" cy="400" r="7"/></g></svg>
<svg class="splash2" viewBox="0 0 500 500" aria-hidden="true"><g filter="url(#splat)" fill="#2b2822" opacity=".85">
  <ellipse cx="210" cy="300" rx="130" ry="80"/><circle cx="330" cy="250" r="50"/></g></svg>

<main class="wrap">
  <div class="head">
    <div class="vtitle">墨色<br>如歌</div>
    <div class="meta">
      <span class="seal">墨</span>
      <div class="tag">範例品牌<br>SAMPLE BRAND<br>一筆一畫，皆是心意</div>
    </div>
  </div>
  <nav class="links" aria-label="連結">
    <a class="link" href="#">LINE 官方帳號<small>@sample</small></a>
    <a class="link" href="#">Instagram<small>@sample</small></a>
    <a class="link" href="#">官方網站<small>sample.com</small></a>
    <a class="link" href="#">Email<small>hello@sample.com</small></a>
  </nav>
  <div class="demo">DEMO ・ 澤拾 Ze Shi Studio　<a href="../">看其他風格</a></div>
</main>
</body>
</html>
