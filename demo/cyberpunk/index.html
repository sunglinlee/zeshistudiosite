<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cyberpunk｜NFC 連結頁範例</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&family=Share+Tech+Mono&family=Noto+Sans+TC:wght@400;700&display=swap">
<style>
  :root{--bg:#07060f;--mag:#ff2bd6;--cy:#00f0ff;--yl:#fcee09;--tx:#e8e6ff;}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font-family:"Share Tech Mono","Noto Sans TC",monospace;display:flex;justify-content:center;overflow-x:hidden;position:relative;}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:5;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px);mix-blend-mode:multiply;}
  .sky{position:fixed;inset:0;background:radial-gradient(60% 40% at 50% 8%,rgba(255,43,214,.35),transparent 70%),radial-gradient(50% 35% at 85% 30%,rgba(0,240,255,.18),transparent 70%);}
  .grid{position:fixed;left:-50%;right:-50%;bottom:-4%;height:78vh;background-image:linear-gradient(var(--mag) 1px,transparent 1px),linear-gradient(90deg,var(--mag) 1px,transparent 1px);background-size:56px 56px;opacity:.45;transform:perspective(520px) rotateX(66deg);transform-origin:center bottom;animation:flow 5s linear infinite;mask-image:linear-gradient(to top,#000,transparent 85%);-webkit-mask-image:linear-gradient(to top,#000,transparent 85%);}
  @keyframes flow{to{background-position:0 56px;}}
  .wrap{position:relative;z-index:2;width:100%;max-width:400px;padding:64px 24px 48px;}
  .badge{display:inline-block;font-size:11px;letter-spacing:.3em;color:var(--yl);border:1px solid var(--yl);padding:4px 10px;}
  h1{margin:18px 0 0;font-family:Orbitron,sans-serif;font-weight:800;font-size:40px;line-height:1.05;letter-spacing:.04em;text-transform:uppercase;position:relative;color:#fff;text-shadow:0 0 18px rgba(0,240,255,.6);}
  h1::before,h1::after{content:attr(data-t);position:absolute;left:0;top:0;width:100%;overflow:hidden;}
  h1::before{color:var(--mag);transform:translate(2px,0);clip-path:inset(0 0 55% 0);animation:g1 3.2s infinite steps(1);mix-blend-mode:screen;}
  h1::after{color:var(--cy);transform:translate(-2px,0);clip-path:inset(55% 0 0 0);animation:g2 2.7s infinite steps(1);mix-blend-mode:screen;}
  @keyframes g1{0%,92%{transform:translate(2px,0);}94%{transform:translate(-5px,1px);}96%{transform:translate(4px,-1px);}100%{transform:translate(2px,0);}}
  @keyframes g2{0%,88%{transform:translate(-2px,0);}90%{transform:translate(6px,0);}93%{transform:translate(-4px,1px);}100%{transform:translate(-2px,0);}}
  .sub{margin-top:14px;color:var(--cy);font-size:13px;letter-spacing:.12em;}
  .links{margin-top:44px;display:flex;flex-direction:column;gap:14px;}
  .link{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;color:var(--tx);text-decoration:none;background:rgba(10,8,28,.78);border:1px solid var(--cy);font-size:15px;letter-spacing:.1em;clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px));box-shadow:inset 0 0 18px rgba(0,240,255,.12);transition:all .18s;}
  .link b{font-family:Orbitron,sans-serif;font-weight:500;}
  .link span{color:var(--mag);font-size:12px;}
  .link:hover,.link:focus-visible{background:var(--cy);color:#04030a;border-color:var(--cy);box-shadow:0 0 22px rgba(0,240,255,.7);}
  .link:hover span{color:#04030a;}
  .link:nth-child(even){border-color:var(--mag);box-shadow:inset 0 0 18px rgba(255,43,214,.12);}
  .link:nth-child(even):hover{background:var(--mag);border-color:var(--mag);box-shadow:0 0 22px rgba(255,43,214,.7);}
  .foot{margin-top:44px;font-size:11px;letter-spacing:.18em;color:#8a85b8;}
  .foot a{color:var(--yl);}
  @media (prefers-reduced-motion:reduce){.grid,h1::before,h1::after{animation:none;}}
</style>
</head>
<body>
<div class="sky"></div><div class="grid"></div>
<main class="wrap">
  <span class="badge">// NFC LINK HUB</span>
  <h1 data-t="NEON SAMPLE">NEON SAMPLE</h1>
  <div class="sub">&gt; 範例品牌 · 夜城連線中_</div>
  <nav class="links" aria-label="連結">
    <a class="link" href="#"><b>LINE</b><span>@sample</span></a>
    <a class="link" href="#"><b>INSTAGRAM</b><span>@sample</span></a>
    <a class="link" href="#"><b>WEBSITE</b><span>sample.com</span></a>
    <a class="link" href="#"><b>EMAIL</b><span>hello@sample.com</span></a>
  </nav>
  <div class="foot">DEMO // 澤拾 Ze Shi Studio　<a href="../">more styles</a></div>
</main>
</body>
</html>
