<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>手繪田園（宮崎駿靈感）｜NFC 連結頁範例</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
  :root{--sky1:#6fb7e8;--sky2:#cfeaf7;--cream:#fffaf0;--leaf:#3f8f4f;--leaf2:#7cc26a;--brown:#6b4a2f;--warm:#f2b350;}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;font-family:"Zen Maru Gothic","Noto Sans TC",sans-serif;color:var(--brown);background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 55%,#f7f4dc 100%);display:flex;justify-content:center;overflow-x:hidden;position:relative;}
  .cloud{position:absolute;background:#fff;border-radius:999px;filter:blur(.3px);opacity:.95;animation:drift linear infinite;}
  .cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%;}
  .c1{top:70px;left:-160px;width:130px;height:38px;animation-duration:70s;}
  .c1::before{width:60px;height:60px;left:22px;top:-30px;} .c1::after{width:44px;height:44px;left:70px;top:-20px;}
  .c2{top:170px;left:-220px;width:180px;height:50px;animation-duration:95s;animation-delay:-30s;opacity:.85;}
  .c2::before{width:84px;height:84px;left:30px;top:-44px;} .c2::after{width:60px;height:60px;left:100px;top:-26px;}
  .c3{top:30px;left:-120px;width:90px;height:28px;animation-duration:55s;animation-delay:-12s;}
  .c3::before{width:42px;height:42px;left:14px;top:-22px;} .c3::after{width:32px;height:32px;left:46px;top:-14px;}
  @keyframes drift{to{transform:translateX(calc(100vw + 400px));}}
  .hills{position:fixed;left:0;right:0;bottom:0;height:36vh;min-height:220px;pointer-events:none;}
  .wrap{position:relative;z-index:2;width:100%;max-width:400px;padding:76px 24px 120px;text-align:center;}
  .sun{width:70px;height:70px;border-radius:50%;margin:0 auto;background:radial-gradient(circle at 35% 35%,#fff6c9,var(--warm));box-shadow:0 0 40px 14px rgba(255,236,160,.7);}
  h1{margin:22px 0 0;font-size:34px;font-weight:700;letter-spacing:.08em;color:#2f5d3a;text-shadow:0 2px 0 rgba(255,255,255,.8);}
  .tag{margin-top:10px;font-size:15px;letter-spacing:.1em;color:#5a6b4a;}
  .links{margin-top:36px;display:flex;flex-direction:column;gap:14px;}
  .link{display:flex;align-items:center;gap:14px;padding:14px 20px;text-decoration:none;color:var(--brown);background:var(--cream);border:2.5px solid #8a6a46;border-radius:26px 30px 24px 32px/30px 24px 32px 26px;box-shadow:0 5px 0 rgba(107,74,47,.35);font-weight:700;font-size:17px;letter-spacing:.06em;transition:transform .15s,box-shadow .15s;text-align:left;}
  .link i{flex:none;width:30px;height:30px;border-radius:50%;background:var(--leaf2);display:flex;align-items:center;justify-content:center;color:#fff;font-style:normal;font-size:15px;}
  .link small{margin-left:auto;font-weight:500;font-size:12px;color:#8a7a62;}
  .link:hover,.link:focus-visible{transform:translateY(3px);box-shadow:0 2px 0 rgba(107,74,47,.35);}
  .demo{margin-top:40px;font-size:12px;letter-spacing:.1em;color:#6b7c58;}
  .demo a{color:inherit;}
  @media (prefers-reduced-motion:reduce){.cloud{animation:none;left:10%;}}
</style>
</head>
<body>
<div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
<svg class="hills" viewBox="0 0 400 220" preserveAspectRatio="none" aria-hidden="true">
  <path d="M0,110 C70,60 150,90 220,70 C300,45 350,80 400,60 L400,220 L0,220Z" fill="#9ed487"/>
  <path d="M0,150 C80,110 140,150 230,125 C310,100 360,140 400,120 L400,220 L0,220Z" fill="#6fb867"/>
  <path d="M0,190 C90,160 170,195 260,172 C330,155 370,180 400,170 L400,220 L0,220Z" fill="#3f8f4f"/>
  <g fill="#2f7a40"><path d="M40,190 q-4,-16 0,-26 q4,10 0,26z"/><path d="M52,192 q-5,-12 0,-22 q5,8 0,22z"/><path d="M330,196 q-4,-16 0,-26 q4,10 0,26z"/><path d="M342,198 q-5,-12 0,-22 q5,8 0,22z"/></g>
  <g fill="#fff"><circle cx="110" cy="150" r="3"/><circle cx="268" cy="162" r="3"/><circle cx="188" cy="176" r="2.5"/></g>
  <g fill="#f2b350"><circle cx="110" cy="150" r="1.4"/><circle cx="268" cy="162" r="1.4"/><circle cx="188" cy="176" r="1.2"/></g>
</svg>
<main class="wrap">
  <div class="sun" aria-hidden="true"></div>
  <h1>風之小店</h1>
  <div class="tag">範例品牌 · 今天也有好天氣</div>
  <nav class="links" aria-label="連結">
    <a class="link" href="#"><i>♪</i>LINE 官方帳號<small>@sample</small></a>
    <a class="link" href="#"><i>✿</i>Instagram<small>@sample</small></a>
    <a class="link" href="#"><i>⌂</i>官方網站<small>sample.com</small></a>
    <a class="link" href="#"><i>✉</i>Email<small>hello@sample.com</small></a>
  </nav>
  <div class="demo">DEMO ・ 澤拾 Ze Shi Studio　<a href="../">看其他風格</a></div>
</main>
</body>
</html>
